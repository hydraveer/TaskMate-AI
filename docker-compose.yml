version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: taskmate-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    networks:
      - taskmate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmate-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - taskmate-network

networks:
  taskmate-network:
    driver: bridge